context:
  name: gotcha
  version: "1.0.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/LLNL/GOTCHA/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 9113c748ee91a159ab08e2a402e739952c4dc4b4b77cf4d569ca17eb2e360ff8

build:
  number: 0
  skip:
    - not linux

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
    - cmake
    - ninja
  run_exports:
    - ${{ pin_subpackage(name, upper_bound="x.x") }}

tests:
  - package_contents:
      include:
        - gotcha/gotcha.h
      lib:
        - gotcha

about:
  repository: https://github.com/LLNL/GOTCHA
  homepage: https://github.com/LLNL/GOTCHA
  license: LGPL-2.1-only
  license_file:
    - LGPL
    - COPYRIGHT
  summary: "GOTCHA is a library for wrapping function calls in shared libraries."
  description: |
    Gotcha is a library that wraps functions. Tools can use gotcha
    to install hooks into other libraries, for example putting a wrapper
    function around libc's malloc.

extra:
  recipe-maintainers:
    - flferretti
    - traversaro
